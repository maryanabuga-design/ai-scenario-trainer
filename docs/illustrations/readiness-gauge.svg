<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="rimTop" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#7C8A52"/>
      <stop offset="0.45" stop-color="#5B6938"/>
      <stop offset="1" stop-color="#46512D"/>
    </linearGradient>
    <linearGradient id="rimSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46512D"/>
      <stop offset="1" stop-color="#343D21"/>
    </linearGradient>
    <linearGradient id="rimInner" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3C4626"/>
      <stop offset="1" stop-color="#6B7A44"/>
    </linearGradient>
    <radialGradient id="face" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#F6F0E3"/>
      <stop offset="0.55" stop-color="#F0E8D8"/>
      <stop offset="1" stop-color="#E4D6BC"/>
    </radialGradient>
    <linearGradient id="needle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C8A52"/>
      <stop offset="1" stop-color="#46512D"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#8B9A5E"/>
      <stop offset="0.5" stop-color="#5B6938"/>
      <stop offset="1" stop-color="#46512D"/>
    </radialGradient>
    <radialGradient id="tip" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#E5A94E"/>
      <stop offset="1" stop-color="#C98A2B"/>
    </radialGradient>
    <radialGradient id="badge" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#7C8A52"/>
      <stop offset="0.55" stop-color="#5B6938"/>
      <stop offset="1" stop-color="#46512D"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft6" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="faceClip"><ellipse cx="512" cy="500" rx="262" ry="236"/></clipPath>
  </defs>
  <g transform="translate(0,-25)">
    <!-- rim: side wall, then the top ring -->
    <ellipse cx="512" cy="548" rx="340" ry="310" fill="url(#rimSide)"/>
    <ellipse cx="512" cy="500" rx="340" ry="310" fill="url(#rimTop)"/>
    <!-- soft light on the upper left of the rim -->
    <path d="M 250 380 Q 300 250 470 205" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="26" stroke-linecap="round" filter="url(#soft6)"/>
    <!-- inner bevel and recessed face -->
    <ellipse cx="512" cy="504" rx="288" ry="260" fill="url(#rimInner)"/>
    <ellipse cx="512" cy="500" rx="262" ry="236" fill="url(#face)"/>
    <!-- inner shadow on the upper edge of the face -->
    <g clip-path="url(#faceClip)">
      <ellipse cx="512" cy="470" rx="262" ry="236" fill="none" stroke="#9A8A66" stroke-opacity="0.35" stroke-width="40" filter="url(#soft)"/>
    </g>
    <!-- scale marks: soft round dots along the upper arc, no numbers -->
    <g fill="#CDBB96">
      <circle cx="320" cy="560" r="13"/>
      <circle cx="300" cy="470" r="13"/>
      <circle cx="338" cy="385" r="13"/>
      <circle cx="410" cy="326" r="13"/>
      <circle cx="512" cy="306" r="13"/>
      <circle cx="614" cy="326" r="13"/>
      <circle cx="686" cy="385" r="13"/>
      <circle cx="724" cy="470" r="13"/>
      <circle cx="704" cy="560" r="13"/>
    </g>
    <g fill="#FFFFFF" fill-opacity="0.55">
      <circle cx="316" cy="554" r="4"/><circle cx="296" cy="464" r="4"/><circle cx="334" cy="379" r="4"/>
      <circle cx="406" cy="320" r="4"/><circle cx="508" cy="300" r="4"/><circle cx="610" cy="320" r="4"/>
      <circle cx="682" cy="379" r="4"/><circle cx="720" cy="464" r="4"/><circle cx="700" cy="554" r="4"/>
    </g>
    <!-- needle shadow -->
    <line x1="520" y1="542" x2="668" y2="426" stroke="#8C7C58" stroke-opacity="0.45" stroke-width="40" stroke-linecap="round" filter="url(#soft6)"/>
    <!-- needle -->
    <line x1="512" y1="512" x2="652" y2="402" stroke="url(#needle)" stroke-width="38" stroke-linecap="round"/>
    <line x1="520" y1="500" x2="640" y2="406" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="8" stroke-linecap="round" filter="url(#soft3)"/>
    <circle cx="654" cy="400" r="22" fill="url(#tip)"/>
    <circle cx="647" cy="392" r="7" fill="#FFFFFF" fill-opacity="0.45" filter="url(#soft3)"/>
    <!-- hub -->
    <circle cx="512" cy="522" r="46" fill="#46512D" fill-opacity="0.35" filter="url(#soft6)"/>
    <circle cx="512" cy="512" r="42" fill="url(#hub)"/>
    <circle cx="500" cy="500" r="12" fill="#FFFFFF" fill-opacity="0.35" filter="url(#soft3)"/>
    <!-- check mark badge at the base -->
    <circle cx="512" cy="812" r="86" fill="#343D21" fill-opacity="0.35" filter="url(#soft6)"/>
    <circle cx="512" cy="800" r="80" fill="#F0E8D8"/>
    <circle cx="512" cy="800" r="64" fill="url(#badge)"/>
    <path d="M 482 802 L 506 826 L 548 776" fill="none" stroke="#F0E8D8" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 470 770 Q 490 750 520 748" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="10" stroke-linecap="round" filter="url(#soft3)"/>
  </g>
</svg>
